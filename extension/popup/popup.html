<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LumenShade</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div>
        <div class="name">LumenShade</div>
        <div class="tag">Smart dark mode</div>
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="enabled" />
      <span class="slider-knob"></span>
    </label>
  </header>

  <section class="site">
    <div class="row">
      <div>
        <div class="label">This site</div>
        <div class="host" id="host">—</div>
      </div>
      <div class="seg">
        <button data-site="default" id="site-default">Default</button>
        <button data-site="on" id="site-on">On</button>
        <button data-site="off" id="site-off">Off</button>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">Adjust</div>
    <div class="slider-row">
      <label>Brightness <span id="v-brightness"></span></label>
      <input type="range" id="brightness" min="0.6" max="1.4" step="0.05" />
    </div>
    <div class="slider-row">
      <label>Contrast <span id="v-contrast"></span></label>
      <input type="range" id="contrast" min="0.7" max="1.3" step="0.05" />
    </div>
    <div class="slider-row">
      <label>Warmth <span id="v-warmth"></span></label>
      <input type="range" id="warmth" min="0" max="1" step="0.05" />
    </div>
    <div class="slider-row">
      <label>Image dimming <span id="v-imageDim"></span></label>
      <input type="range" id="imageDim" min="0.5" max="1" step="0.05" />
    </div>
  </section>

  <section class="block">
    <div class="block-head">Schedule</div>
    <div class="seg full">
      <button data-mode="always" id="m-always">Always on</button>
      <button data-mode="schedule" id="m-schedule">Sunset/sunrise</button>
    </div>
    <div class="time-row" id="time-row">
      <label>From <input type="time" id="from" /></label>
      <label>To <input type="time" id="to" /></label>
    </div>
  </section>

  <footer>
    <button id="reset">Reset to defaults</button>
    <a href="https://lumenshade.lovable.app/pricing" target="_blank">Get Pro · from $6/yr</a>
  </footer>
</div>
<script src="popup.js"></script>
</body>
</html>
